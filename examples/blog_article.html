  <h1>三个让公众号更好读的小改动</h1>
  <p>这是导语。讲清楚为什么要改。</p>
  <h2>一、先把结论放前面</h2>
  <p>读者只有三秒决定要不要继续读，<strong>结论前置</strong>是最有效的改动。</p>
  <h2>二、段落别超过三行</h2>
  <p>手机一屏只有十几行，超过三行的段落，滑走率明显变高。</p>
  <p>可以这样拆：<br>第一句给事实。<br>第二句给判断。</p>
  <h2>三、给图片加说明</h2>
  <figure>
    <img src="imgs/example.png" alt="示例图">
    <figcaption>图注：说明画面里发生了什么。</figcaption>
  </figure>
</article>
